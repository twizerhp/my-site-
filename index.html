.page {

}

========================= */

.tracks {

    gap: 13px;
}

.track {

    background: rgba(255,255,255,.045);

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 14px;

    padding: 16px 20px;

    backdrop-filter: blur(15px);

    transition: .25s;
}

.track:hover {

    border-color: rgba(180,0,0,.35);

}


/* Активный трек */

.track.active {

    background: rgba(130,0,0,.16);

    border-color: rgba(180,0,0,.45);

    box-shadow:
        0 10px 35px rgba(0,0,0,.5),
        0 0 25px rgba(120,0,0,.12);
}


/* =========================
   НАЗВАНИЕ
========================= */

.track-name {

    display: flex;

    align-items: center;

    gap: 15px;

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 9px;
}

.number {

    width: 25px;

    color: #666;

    font-size: 12px;
}


/* =========================
   ПЛЕЕР
========================= */

audio {

    width: 100%;

    height: 38px;

    opacity: .85;

    filter:
        invert(1)
        sepia(1)
        saturate(5)
        hue-rotate(315deg)
        brightness(.75);
}


/* =========================
   ПРАВАЯ ЧАСТЬ
========================= */

.right {

    top: 50px;

    height: fit-content;

    display: flex;

    justify-content: center;

    z-index: 2;
}

.album {

    width: min(430px, 90%);

    text-align: center;
}


/* =========================
   ОБЛОЖКА
========================= */

.cover-box {

    width: 100%;

    aspect-ratio: 1 / 1;

    padding: 9px;

    border-radius: 22px;

    background: rgba(255,255,255,.05);

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 70px rgba(0,0,0,.7),
        0 0 60px rgba(130,0,0,.25);

    animation: floating 6s ease-in-out infinite;
}

.cover-box img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 15px;

        0 15px 50px rgba(0,0,0,.7);
}


/* =========================
   АНИМАЦИЯ
========================= */

@keyframes floating {

    0% {
        transform: translateY(0);

    50% {

    }

    100% {
        transform: translateY(0);

}


/* =========================

========================= */

.album-title {

}

========================= */

}

<script>


/*
=========================================
   ВСЕ 14 АУДИОПЛЕЕРОВ
=========================================
*/

const players = document.querySelectorAll("audio");

const trackCards = document.querySelectorAll(".track");


/*
=========================================
   ТОЛЬКО ОДНА ПЕСНЯ МОЖЕТ ИГРАТЬ
=========================================
*/

players.forEach((player, index) => {


    player.addEventListener("play", function() {


        /*
        Останавливаем все остальные
        */

        players.forEach((otherPlayer) => {

            if (otherPlayer !== player) {

                otherPlayer.pause();

            }

        });


        /*
        Убираем active у всех
        */

        trackCards.forEach((card) => {

            card.classList.remove("active");

        });


        /*
        Делаем текущий трек активным
        */

        trackCards[index].classList.add("active");

    });


    /*
    =====================================
       ПЕСНЯ ЗАКОНЧИЛАСЬ
    =====================================
    */

    player.addEventListener("ended", function() {


        trackCards[index].classList.remove("active");


        /*
        Индекс следующей песни
        */

        const nextIndex = index + 1;


        /*
        Если есть следующий трек
        */

        if (nextIndex < players.length) {


            const nextPlayer = players[nextIndex];


            nextPlayer.currentTime = 0;


            /*
            Запускаем следующую песню
            */

            nextPlayer.play().catch(function(error) {

                console.log(
                    "Не удалось автоматически запустить следующий трек:",
                    error
                );

            });

        }


        /*
        После 14-го начинаем с 1-го
        */

        else {


            const firstPlayer = players[0];


            firstPlayer.currentTime = 0;


            firstPlayer.play().catch(function(error) {

                console.log(
                    "Не удалось автоматически запустить первый трек:",
                    error
                );

            });

        }

    });

});


</script>
