/* =========================
   ПЛЕЕР
========================= */

audio {

}


/* =========================
   ПРАВАЯ ЧАСТЬ
========================= */

.right {

    justify-content: center;

    z-index: 2;
}

.album {

}


/* =========================
   ОБЛОЖКА
========================= */

.cover-box {

    width: 100%;

    aspect-ratio: 1 / 1;

    padding: 9px;

    border-radius: 22px;

    background: rgba(255,255,255,.05);

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 70px rgba(0,0,0,.7),
        0 0 60px rgba(130,0,0,.25);

    animation: floating 6s ease-in-out infinite;
}

.cover-box img {

    width: 100%;

    height: 100%;

    display: block;

    border-radius: 15px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.7);
}


/* =========================
   АНИМАЦИЯ
========================= */

@keyframes floating {

/* =========================

========================= */

@media (max-width: 900px) {

<script>

/*
====================================================
       ОДИН ТРЕК ЗА РАЗ
====================================================

У каждого трека остаётся свой audio-плеер.

Когда человек нажимает Play:
все остальные автоматически останавливаются.

====================================================
*/


const players = document.querySelectorAll("audio");

const cards = document.querySelectorAll(".track");


/*
====================================================
       ЗАПУСК ТРЕКА
====================================================
*/

players.forEach((player, index) => {

    player.addEventListener("play", function() {


        /*
        Останавливаем ВСЕ остальные плееры
        */

        players.forEach((otherPlayer) => {

            if (otherPlayer !== player) {

                otherPlayer.pause();

            }

        });


        /*
        Убираем подсветку
        */

        cards.forEach((card) => {

            card.classList.remove("active");

        });


        /*
        Подсвечиваем текущий трек
        */

        cards[index].classList.add("active");

    });


    /*
    ==================================================
       ПАУЗА
    ==================================================
    */

    player.addEventListener("pause", function() {

        if (!player.ended) {

            cards[index].classList.remove("active");

        }

    });


    /*
    ==================================================
       КОНЕЦ ТРЕКА
    ==================================================
    */

    player.addEventListener("ended", function() {


        cards[index].classList.remove("active");


        /*
        Следующий трек
        */

        const nextIndex = index + 1;


        /*
        Если есть следующий —
        автоматически запускаем его
        */

        if (nextIndex < players.length) {

            players[nextIndex].currentTime = 0;

            players[nextIndex].play().catch(() => {});

        }


        /*
        После 14-го возвращаемся к 01
        */

        else {

            players[0].currentTime = 0;

            players[0].play().catch(() => {});

        }

    });

});


</script>
