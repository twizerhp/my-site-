        html {

            color: white;
            font-family: Arial, Helvetica, sans-serif;

        .page {
            width: 92%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 50px 0;
            display: grid;
            grid-template-columns: 1.4fr 0.8fr;
            gap: 70px;
            align-items: start;
        }

        /* LEFT SIDE */

        .left {
            min-width: 0;
        }

        .header {
            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0;
            font-size: clamp(34px, 5vw, 72px);
            line-height: 0.95;
            font-weight: 900;
            letter-spacing: -3px;
        }

        .artist {
            margin-top: 14px;
            color: #999;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .tracks {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .track {
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .track:hover {
            transform: translateX(5px);
            border-color: rgba(190, 30, 30, 0.5);
            background: rgba(160, 0, 0, 0.08);
        }

        .track.active {
            border-color: rgba(220, 35, 35, 0.65);
            background: rgba(150, 0, 0, 0.10);
        }

        .track-name {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 17px;
            font-weight: 800;
        }

        .number {
            color: #777;
            min-width: 30px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        audio {
            display: block;
            width: 100%;
            height: 38px;
            opacity: 0.9;
            filter:
                invert(1)
                sepia(1)
                saturate(5)
                hue-rotate(315deg)
                brightness(0.75);
        }

        /* RIGHT SIDE */

        .right {
            position: sticky;
            top: 40px;
        }

        .cover-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 9px;
            border-radius: 22px;

            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.14);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.65),
                0 0 50px rgba(120, 0, 0, 0.12);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            animation: floating 5s ease-in-out infinite;
        }

        .cover-box img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 16px;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .album-info {
            margin-top: 25px;
        }

        .album-title {
            margin: 0;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .album-subtitle {
            margin-top: 7px;
            color: #777;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            .page {
                width: 92%;
                padding: 30px 0 50px;
                grid-template-columns: 1fr;
                gap: 45px;
            }

            .right {
                position: static;
                grid-row: 1;
            }

            .left {
                grid-row: 2;
            }

            .cover-box {
                max-width: 650px;
                margin: 0 auto;
            }

            .album-info {
                max-width: 650px;
                margin: 22px auto 0;
            }

            .header h1 {
                font-size: clamp(32px, 10vw, 55px);
            }
        }

        @media (max-width: 500px) {

            .page {
                width: 94%;
                padding-top: 20px;
                gap: 35px;
            }

            .track {

            }

            .track-name {
                font-size: 15px;
            }

            audio {
                height: 36px;
            }

            .artist {
                font-size: 11px;
                letter-spacing: 3px;
            }
        }
    </style>

<script>
    /*
     * MUSIC PLAYER
     *
     * 1. Одновременно играет только один трек.
     * 2. При окончании трека автоматически запускается следующий.
     * 3. После 14-го снова запускается 1-й.
     */

    const players = Array.from(document.querySelectorAll("audio"));
    const tracks = Array.from(document.querySelectorAll(".track"));

    players.forEach((player, index) => {

        /* Когда пользователь нажал Play */
        player.addEventListener("play", () => {

            /* Останавливаем ВСЕ остальные плееры */
            players.forEach((otherPlayer, otherIndex) => {

                if (otherPlayer !== player) {
                    otherPlayer.pause();

                    if (tracks[otherIndex]) {
                        tracks[otherIndex].classList.remove("active");
                    }
                }

            });

            /* Подсвечиваем текущий трек */
            if (tracks[index]) {
                tracks[index].classList.add("active");
            }
        });


        /* Когда трек поставили на паузу */
        player.addEventListener("pause", () => {

            if (!player.ended && tracks[index]) {
                tracks[index].classList.remove("active");
            }

        });


        /* Когда трек полностью закончился */
        player.addEventListener("ended", () => {

            if (tracks[index]) {
                tracks[index].classList.remove("active");
            }

            let nextIndex = index + 1;

            /* После 14-го возвращаемся к первому */
            if (nextIndex >= players.length) {
                nextIndex = 0;
            }

            const nextPlayer = players[nextIndex];

            if (nextPlayer) {

                nextPlayer.currentTime = 0;

                nextPlayer.play().catch(error => {
                    console.log("Автозапуск следующего трека заблокирован браузером:", error);
                });

            }

        });

    });
</script>
