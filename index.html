rgba(130, 0, 0, 0.18), rgba(255, 255, 255, 0.035) ); border-color: rgba(180, 0, 0, 0.35); box-shadow: 0 0 25px rgba(130, 0, 0, 0.12); } /* НАЗВАНИЕ */ .track-title { display: flex; align-items: center; gap: 13px; margin-bottom: 10px; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; } .number { width: 25px; color: #666; font-size: 12px; font-weight: 500; } /* АУДИО */ audio { width: 100%; height: 38px; opacity: 0.85; filter: invert(1) sepia(1) saturate(5) hue-rotate(315deg) brightness(0.75); } /* ПРАВАЯ ЧАСТЬ */ .album { position: sticky; top: 45px; height: fit-content; display: flex; flex-direction: column; align-items: center; } /* ОБЛОЖКА */ .cover-box { position: relative; width: min(430px, 90%); aspect-ratio: 1 / 1; padding: 9px; border-radius: 22px; background: rgba(255, 255, 255, 0.045); border: 1px solid rgba(255, 255, 255, 0.10); backdrop-filter: blur(18px); box-shadow: 0 25px 80px rgba(0, 0, 0, 0.65), 0 0 60px rgba(110, 0, 0, 0.22); animation: float 6s ease-in-out infinite; } /* Красное свечение за обложкой */ .cover-box::before { content: ""; position: absolute; inset: -45px; background: radial-gradient( circle, rgba(150, 0, 0, 0.24), transparent 65% ); filter: blur(25px); z-index: -1; } .cover { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 15px; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.65); } @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-9px); } 100% { transform: translateY(0px); } } /* ТЕКСТ ПОД ОБЛОЖКОЙ */ .album-info { text-align: center; margin-top: 25px; } .album-info h2 { font-size: 23px; letter-spacing: 1px; } .album-info p { margin-top: 7px; color: #777; font-size: 14px; letter-spacing: 1px; } /* Декоративные красные пятна */ .glow { position: fixed; width: 400px; height: 400px; border-radius: 50%; background: rgba(120, 0, 0, 0.08); filter: blur(100px); pointer-events: none; z-index: -2; } .glow-1 { top: -150px; right: -100px; } .glow-2 { bottom: -200px; left: -100px; } /* МОБИЛЬНАЯ ВЕРСИЯ */ @media (max-width: 950px) { .page { grid-template-columns: 1fr; gap: 40px; } .album { position: relative; top: 0; grid-row: 1; } .tracks { grid-row: 2; } .cover-box { width: min(450px, 85vw); } } @media (max-width: 550px) { .page { width: 95%; padding-top: 25px; } .title { font-size: 38px; } .track { padding: 15px; } } </style> </head> <body> <div class="glow glow-1"></div> <div class="glow glow-2"></div> <main class="page"> <!-- ========================= --> <!-- ЛЕВАЯ ЧАСТЬ --> <!-- ========================= --> <section class="tracks"> <h1 class="title"> REST IN BASS:<br> ENCORE </h1> <div class="artist"> CHE · 2025 · 14 TRACKS </div> <!-- 01 --> <div class="track"> <div class="track-title"> <span class="number">01</span> KING OF ROCK </div> <audio controls preload="metadata"> <source src="01 KING OF ROCK.mp3" type="audio/mpeg"> </audio> </div> <!-- 02 --> <div class="track"> <div class="track-title"> <span class="number">02</span> MAKE OUT WITH MY CHOPPA </div> <audio controls preload="metadata"> <source src="02 MAKE OUT WITH MY CHOPPA.mp3" type="audio/mpeg"> </audio> </div> <!-- 03 --> <div class="track"> <div class="track-title"> <span class="number">03</span> HOLY MOLY </div> <audio controls preload="metadata"> <source src="03 HOLY MOLY.mp3" type="audio/mpeg"> </audio> </div> <!-- 04 --> <div class="track"> <div class="track-title"> <span class="number">04</span> DIE HARD </div> <audio controls preload="metadata"> <source src="04 DIE HARD.mp3" type="audio/mpeg"> </audio> </div> <!-- 05 --> <div class="track"> <div class="track-title"> <span class="number">05</span> CUTTHROAT </div> <audio controls preload="metadata"> <source src="05 CUTTHROAT.mp3" type="audio/mpeg"> </audio> </div> <!-- 06 --> <div class="track"> <div class="track-title"> <span class="number">06</span> MONSTER </div> <audio controls preload="metadata"> <source src="06 MONSTER.mp3" type="audio/mpeg"> </audio> </div> <!-- 07 --> <div class="track"> <div class="track-title"> <span class="number">07</span> DIRTY SPRITE </div> <audio controls preload="metadata"> <source src="07 DIRTY SPRITE.mp3" type="audio/mpeg"> </audio> </div> <!-- 08 --> <div class="track"> <div class="track-title"> <span class="number">08</span> SERVE DA BA$$ </div> <audio controls preload="metadata"> <source src="08 SERVE DA BA$$.mp3" type="audio/mpeg"> </audio> </div> <!-- 09 --> <div class="track"> <div class="track-title"> <span class="number">09</span> RIRI </div> <audio controls preload="metadata"> <source src="09 RIRI.mp3" type="audio/mpeg"> </audio> </div> <!-- 10 --> <div class="track"> <div class="track-title"> <span class="number">10</span> WHIPPIN </div> <audio controls preload="metadata"> <source src="10 WHIPPIN.mp3" type="audio/mpeg"> </audio> </div> <!-- 11 --> <div class="track"> <div class="track-title"> <span class="number">11</span> WHATS LOVE </div> <audio controls preload="metadata"> <source src="11 WHATS LOVE.mp3" type="audio/mpeg"> </audio> </div> <!-- 12 --> <div class="track"> <div class="track-title"> <span class="number">12</span> FREAK NEEK </div> <audio controls preload="metadata"> <source src="12 FREAK NEEK.mp3" type="audio/mpeg"> </audio> </div> <!-- 13 --> <div class="track"> <div class="track-title"> <span class="number">13</span> UAV </div> <audio controls preload="metadata"> <source src="13 UAV.mp3" type="audio/mpeg"> </audio> </div> <!-- 14 --> <div class="track"> <div class="track-title"> <span class="number">14</span> IM SORRY </div> <audio controls preload="metadata"> <source src="14 IM SORRY.mp3" type="audio/mpeg"> </audio> </div> </section> <!-- ========================= --> <!-- ПРАВАЯ ЧАСТЬ --> <!-- ========================= --> <aside class="album"> <div class="cover-box"> <img class="cover" src="cover.jpg" alt="REST IN BASS: ENCORE — Che"> </div> <div class="album-info"> <h2>CHE</h2> <p>REST IN BASS: ENCORE</p> </div> </aside> </main> <script> const tracks = document.querySelectorAll(".track"); const players = document.querySelectorAll("audio"); players.forEach((player, index) => { /* Когда нажали Play */ player.addEventListener("play", () => { /* Останавливаем остальные */ players.forEach((other, otherIndex) => { if (otherIndex !== index) { other.pause(); } }); /* Убираем подсветку */ tracks.forEach(track => { track.classList.remove("active"); }); /* Подсвечиваем текущий */ tracks[index] .classList.add("active"); }); /* Если поставили паузу */ player.addEventListener("pause", () => { if (!player.ended) { tracks[index] .classList.remove("active"); } }); /* После песни автоматически следующая */ player.addEventListener("ended", () => { tracks[index] .classList.remove("active"); if (index < players.length - 1) { players[index + 1].play(); } }); }); </script> </body> </html>
