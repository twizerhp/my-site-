<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Encore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .player {
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        /* ЛЕВАЯ ЧАСТЬ */
        .left {
            width: 50%;
            height: 100%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .track-name {
            font-size: 30px;
            margin-bottom: 25px;
            word-break: break-word;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #333;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: white;
        }

        .time {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        button {
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 30px;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.6;
            transform: scale(1.08);
        }

        #play {
            font-size: 42px;
        }

        /* ПРАВАЯ ЧАСТЬ */
        .right {
            width: 50%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 800px) {
            body {
                overflow: auto;
            }

            .player {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                min-height: 50vh;
                padding: 30px;
            }

            .right {
                height: 50vh;
            }
        }
    </style>
</head>

<body>

<div class="player">

    <!-- ЛЕВАЯ СТОРОНА -->
    <div class="left">

        <div class="title">
            ENCORE
        </div>

        <div class="track-name" id="trackName">
            Трек 1
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress" id="progress"></div>
        </div>

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">

            <button id="prev">
                ⏮
            </button>

            <button id="play">
                ▶
            </button>

            <button id="next">
                ⏭
            </button>

        </div>

    </div>


    <!-- ПРАВАЯ СТОРОНА -->
    <div class="right">

        <img
            id="cover"
            class="cover"
            src="cover.jpg"
            alt="Cover"
        >

    </div>

</div>


<!-- ЕДИНСТВЕННЫЙ AUDIO -->
<audio id="audio"></audio>


<script>

    /*
    ==========================================
                ТВОИ ТРЕКИ
    ==========================================
    */

    const tracks = [

        {
            name: "Che - IM SORRY",
            file: "Che - IM SORRY.mp3",
            cover: "cover.jpg"
        },

        {
            name: "Трек 2",
            file: "track2.mp3",
            cover: "cover2.jpg"
        },

        {
            name: "Трек 3",
            file: "track3.mp3",
            cover: "cover3.jpg"
        },

        {
            name: "Трек 4",
            file: "track4.mp3",
            cover: "cover4.jpg"
        }

    ];


    /*
    ==========================================
                ЭЛЕМЕНТЫ
    ==========================================
    */

    const audio = document.getElementById("audio");

    const playButton = document.getElementById("play");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");

    const trackName = document.getElementById("trackName");
    const cover = document.getElementById("cover");

    const progress = document.getElementById("progress");
    const progressContainer = document.getElementById("progressContainer");

    const currentTimeElement = document.getElementById("currentTime");
    const durationElement = document.getElementById("duration");


    /*
    ==========================================
                ТЕКУЩИЙ ТРЕК
    ==========================================
    */

    let currentTrack = 0;


    /*
    ==========================================
                ЗАГРУЗКА ТРЕКА
    ==========================================
    */

    function loadTrack(index, autoplay = false) {

        currentTrack = index;

        const track = tracks[currentTrack];

        /*
        СНАЧАЛА ОСТАНАВЛИВАЕМ
        ПРЕДЫДУЩИЙ ТРЕК
        */

        audio.pause();

        audio.currentTime = 0;

        /*
        Загружаем новый
        */

        audio.src = track.file;

        audio.load();

        /*
        Меняем название
        */

        trackName.textContent = track.name;

        /*
        Меняем обложку
        */

        cover.src = track.cover;

        /*
        Сбрасываем прогресс
        */

        progress.style.width = "0%";

        currentTimeElement.textContent = "0:00";

        durationElement.textContent = "0:00";

        playButton.textContent = "▶";


        /*
        Если нужно сразу запустить
        */

        if (autoplay) {

            audio.play()
                .then(() => {

                    playButton.textContent = "Ⅱ";

                })
                .catch(error => {

                    console.log("Автозапуск заблокирован браузером:", error);

                });

        }

    }


    /*
    ==========================================
                    PLAY / PAUSE
    ==========================================
    */

    playButton.addEventListener("click", () => {

        if (audio.paused) {

            audio.play();

            playButton.textContent = "Ⅱ";

        } else {

            audio.pause();

            playButton.textContent = "▶";

        }

    });


    /*
    ==========================================
                    NEXT
    ==========================================
    */

    nextButton.addEventListener("click", () => {

        let nextTrack = currentTrack + 1;

        /*
        Если дошли до конца —
        возвращаемся на первый
        */

        if (nextTrack >= tracks.length) {

            nextTrack = 0;

        }

        /*
        Загружаем и сразу запускаем
        */

        loadTrack(nextTrack, true);

    });


    /*
    ==========================================
                    PREVIOUS
    ==========================================
    */

    prevButton.addEventListener("click", () => {

        let previousTrack = currentTrack - 1;

        /*
        Если мы на первом —
        переходим на последний
        */

        if (previousTrack < 0) {

            previousTrack = tracks.length - 1;

        }

        /*
        Загружаем и сразу запускаем
        */

        loadTrack(previousTrack, true);

    });


    /*
    ==========================================
            АВТОМАТИЧЕСКИ СЛЕДУЮЩАЯ ПЕСНЯ
    ==========================================
    */

    audio.addEventListener("ended", () => {

        let nextTrack = currentTrack + 1;

        /*
        Если последний трек закончился —
        начинаем сначала
        */

        if (nextTrack >= tracks.length) {

            nextTrack = 0;

        }

        /*
        Следующий трек запускается автоматически
        */

        loadTrack(nextTrack, true);

    });


    /*
    ==========================================
                ОБНОВЛЕНИЕ ПРОГРЕССА
    ==========================================
    */

    audio.addEventListener("timeupdate", () => {

        if (!audio.duration) {
            return;
        }

        const percentage =
            (audio.currentTime / audio.duration) * 100;

        progress.style.width = percentage + "%";

        currentTimeElement.textContent =
            formatTime(audio.currentTime);

    });


    /*
    ==========================================
                ДЛИТЕЛЬНОСТЬ
    ==========================================
    */

    audio.addEventListener("loadedmetadata", () => {

        durationElement.textContent =
            formatTime(audio.duration);

    });


    /*
    ==========================================
                ОШИБКА АУДИО
    ==========================================
    */

    audio.addEventListener("error", () => {

        console.log(
            "Не удалось загрузить:",
            tracks[currentTrack].file
        );

    });


    /*
    ==========================================
                ПЕРЕМАТЫВАНИЕ
    ==========================================
    */

    progressContainer.addEventListener("click", (event) => {

        if (!audio.duration) {
            return;
        }

        const width =
            progressContainer.clientWidth;

        const clickX =
            event.offsetX;

        const newTime =
            (clickX / width) * audio.duration;

        audio.currentTime = newTime;

    });


    /*
    ==========================================
                ФОРМАТ ВРЕМЕНИ
    ==========================================
    */

    function formatTime(seconds) {

        if (isNaN(seconds)) {
            return "0:00";
        }

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            Math.floor(seconds % 60);

        return minutes + ":" +
            (secs < 10 ? "0" : "") +
            secs;

    }


    /*
    ==========================================
            ЗАПУСК ПЕРВОГО ТРЕКА
    ==========================================
    */

    loadTrack(0, false);

</script>

</body>
</html>
