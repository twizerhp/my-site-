<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REST IN BASS: ENCORE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 80% 20%, rgba(100, 0, 0, 0.35), transparent 35%),
                radial-gradient(circle at 20% 80%, rgba(40, 40, 40, 0.25), transparent 35%),
                #090909;
        }

        .page {
            width: 92%;
            max-width: 1500px;
            margin: auto;

            display: grid;
            grid-template-columns: 1.35fr 0.75fr;
            gap: 70px;

            padding: 50px 0;
        }

        .tracks {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .title {
            margin-bottom: 20px;
        }

        .title h1 {
            font-size: 42px;
            margin: 0 0 8px 0;
            letter-spacing: 2px;
        }

        .title p {
            margin: 0;
            color: #999;
            font-size: 15px;
        }

        .track {
            padding: 18px 20px;

            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 14px;

            backdrop-filter: blur(10px);

            transition: 0.25s;
        }

        .track:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .track-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
            height: 40px;
        }

        .cover-area {
            display: flex;
            justify-content: center;
            align-items: flex-start;

            position: sticky;
            top: 40px;
        }

        .cover-box {
            width: min(430px, 100%);
            aspect-ratio: 1 / 1;

            padding: 9px;

            border-radius: 22px;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.8),
                0 0 70px rgba(120, 0, 0, 0.3);
        }

        .cover-box img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 15px;
        }

        .album-info {
            text-align: center;
            margin-top: 18px;
        }

        .album-info h2 {
            margin: 0;
            font-size: 24px;
        }

        .album-info p {
            color: #888;
            margin-top: 7px;
        }

        @media (max-width: 850px) {

            .page {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 30px 0;
            }

            .cover-area {
                grid-row: 1;
                position: static;
            }

            .cover-box {
                width: min(400px, 90%);
            }

            .title h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- ЛЕВАЯ ЧАСТЬ -->
